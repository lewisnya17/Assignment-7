<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Untitled Document</title>
<link href="https://fonts.googleapis.com/css2?family=Borel&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
    @font-face {
        font-family: Candara;
        src: url("Candara.ttf");
    } h1 {
        text-align: center;
        font-weight: normal;
    } form {
        width: 600px;
        min-height: 600px;
        padding: 24px;
        background: lightpink;
        margin: 36px auto;
        border: 1px solid lightpink;
        box-shadow: 2px 3px 6px darkgray;
        border-radius: 18px;
        font: 14pt/1.2em "Candara";
    } fieldset {
        margin-top: 18px;
    } #personal input, #submit {
        width: 100%;
        height: 24px;
        margin-bottom: 12px;
    }
</style>
</head>

<body>
    <form action="https://formsubmit.co/nyalewis31@gmail.com" method="post">
    <h1>Contact Us</h1>
	<label for="fname">First Name:</label><br/>
		<input type="text" id="fname" value="First Name"/><br/>
		<label for="lname">Last Name</label><br/>
		<input type="text" id="lname" value="Last Name" /><br/>
		<label for="email">Email</label><br/>
		<input type="text" id="email" value="Email"/><br/>
		
		<fieldset>
		<legend>Reason for Contact</legend>
		<input type="radio" name="services" id="design" value="Design" />
		<label for="design">Design Services</label><br/>
		<input type="radio" name="services" id="consulting" value="Consulting" />
		<label for="consulting">Consulting</label><br/>
		<input type="radio" name="services" id="inquiries" value="Other Inquiries" />
		<label for="inquiries">Other Inquiries</label>
		</fieldset>
		
		<fieldset>
		<legend>Operating System</legend>
		<input type="checkbox" name="os" id="macos" value="MacOS" />
		<label for="macos">Macintosh</label><br/>
		<input type="checkbox" name="os" id="windows" value="Windows" />
		<label for="macos">Windows</label><br/>
		<input type="checkbox" name="unix" id="unix" value="UNIX" />
		<label for="unix">UNIX</label>	
		</fieldset>
		
		<fieldset>
		<legend>TimeFrame</legend>
		<select multiplw>
			<option value="">When do you want to work with me?</option>
			<option value="month">This Month</option>
			<option value="quarter">This Quarter</option>
			<option value="year">This Year</option>
			<option value="not sure">Not Sure</option>
		</select>
		</fieldset>
		<input type="submit" value="Submit" />
		
    </form>
</body>
</html>
